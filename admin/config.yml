# 🔒 PROTECTED FILE - Solved and Verified. DO NOT CHANGE.
backend:
  name: git-gateway
  branch: main # Confirme se no seu GitHub a branch principal é 'main' ou 'master'

media_folder: "imagens"
public_folder: "/imagens"

# ==========================================================================
# --- DEFINIÇÃO DO ANCHOR (Bloco Reutilizável de Produto) ---
# ==========================================================================

produto_fields: &produto_fields
  - {label: "Nome da Peça", name: "nome", widget: "string", hint: "Nome comercial do produto (ex: Mesa Jantar)"}
  - {label: "Código", name: "codigo", widget: "string", required: false}
  - {label: "Preço (ex: 9.999,99)", name: "preco", widget: "string", hint: "Use formato brasileiro com vírgula"}
  - label: "Imagem Principal (Capa)"
    name: "imagem_principal"
    widget: "image"
    hint: "Use imagens na vertical ou quadrada para melhor resultado. Esta imagem aparecerá no Feed."
  - label: "Descrição Completa"
    name: "descricao"
    widget: "text"
    required: false
  - label: "Espécie (Madeira)"
    name: "info_especie"
    widget: "string"
    required: false
  - label: "Origem"
    name: "info_origem"
    widget: "string"
    required: false
  - label: "Projeto (Designer)"
    name: "projeto"
    widget: "string"
    required: false
  - label: "Acabamentos"
    name: "acabamentos"
    widget: "string"
    required: false
  - label: "Medidas (ex: 1,10m diâmetro...)"
    name: "medidas"
    widget: "text"
    required: false
    hint: "Pule linhas para separar medidas diferentes se necessário"
  - label: "Peso"
    name: "peso"
    widget: "string"
    required: false
  - label: "Portfólio (Fotos Extras)"
    name: "portfolio"
    widget: "image"
    multiple: true
    hint: "Selecione várias fotos de uma vez (Segure Shift ou Ctrl)"


# ==========================================================================
# --- ESTRUTURA DO SITE ---
# ==========================================================================
collections:
  - name: "catalogo"
    label: "Gestor de Conteúdo (Catálogo)"
    files:
      - label: "Produtos & Categorias"
        name: "produtos"
        file: "_data/catalogo.json"
        
        # O campo 'fields' define a estrutura geral do JSON
        fields:
          # 1. APARADORES
          - label: "1. Aparadores"
            name: "aparadores"
            widget: "object" 
            collapsed: true
            hint: "Clique para editar os Aparadores"
            fields:
              - {label: "Imagem de Capa (Story)", name: "story_image", widget: "image", hint: "Imagem que aparece na bolinha dos Stories"}
              - label: "Lista de Produtos (Aparadores)"
                name: "items" 
                widget: "list"
                label_singular: "Produto"
                collapsed: true
                hint: "Clique no botão (+) para adicionar um novo Aparador"
                summary: "{{fields.nome}}"
                fields: *produto_fields 

          # 2. BANCOS
          - label: "2. Bancos"
            name: "bancos"
            widget: "object"
            collapsed: true
            hint: "Clique para editar os Bancos"
            fields:
              - {label: "Imagem de Capa (Story)", name: "story_image", widget: "image"}
              - label: "Lista de Produtos (Bancos)"
                name: "items"
                widget: "list"
                label_singular: "Produto"
                collapsed: true
                hint: "Clique no botão (+) para adicionar um novo Banco"
                summary: "{{fields.nome}}"
                fields: *produto_fields

          # 3. ARTÍSTICAS (Antiga BANCADAS)
          - label: "3. Artísticas"
            name: "artisticas" # Slug sem acento para a chave JSON
            widget: "object"
            collapsed: true
            hint: "Clique para editar as Peças Artísticas"
            fields:
              - {label: "Imagem de Capa (Story)", name: "story_image", widget: "image"}
              - label: "Lista de Produtos (Artísticas)"
                name: "items"
                widget: "list"
                label_singular: "Produto"
                collapsed: true
                hint: "Clique no botão (+) para adicionar uma nova Peça"
                summary: "{{fields.nome}}"
                fields: *produto_fields
          
          # 4. CHAMPANHEIRAS
          - label: "4. Champanheiras"
            name: "champanheiras"
            widget: "object"
            collapsed: true
            hint: "Clique para editar as Champanheiras"
            fields:
              - {label: "Imagem de Capa (Story)", name: "story_image", widget: "image"}
              - label: "Lista de Produtos (Champanheiras)"
                name: "items"
                widget: "list"
                label_singular: "Produto"
                collapsed: true
                hint: "Clique no botão (+) para adicionar uma nova Champanheira"
                summary: "{{fields.nome}}"
                fields: *produto_fields

          # 5. ESCULTURAS
          - label: "5. Esculturas"
            name: "esculturas"
            widget: "object"
            collapsed: true
            hint: "Clique para editar as Esculturas"
            fields:
              - {label: "Imagem de Capa (Story)", name: "story_image", widget: "image"}
              - label: "Lista de Produtos (Esculturas)"
                name: "items"
                widget: "list"
                label_singular: "Produto"
                collapsed: true
                hint: "Clique no botão (+) para adicionar uma nova Escultura"
                summary: "{{fields.nome}}"
                fields: *produto_fields
          
          # 6. MESAS (Objeto com sub-categorias)
          - label: "6. Mesinhas"
            name: "mesas"
            widget: "object"
            collapsed: true
            hint: "Atenção: Mesas possuem Sub-Categorias"
            fields:
              - {label: "Imagem de Capa (Story)", name: "story_image", widget: "image"} 
              - label: "Sub-Categorias de Mesas"
                name: "subcategories"
                widget: "object"
                fields:
                  - label: "Mesas de Apoio"
                    name: "apoio"
                    widget: "list"
                    label_singular: "Mesa de Apoio"
                    collapsed: true
                    summary: "{{fields.nome}}"
                    fields: *produto_fields
                  
                  - label: "Mesas de Canto"
                    name: "canto"
                    widget: "list"
                    label_singular: "Mesa de Canto"
                    collapsed: true
                    summary: "{{fields.nome}}"
                    fields: *produto_fields
                  

          
          # 7. MESAS DE JANTAR (NOVO)
          - label: "7. Mesas de Jantar"
            name: "mesas_jantar"
            widget: "object"
            collapsed: true
            hint: "Categoria exclusiva para Mesas de Jantar"
            fields:
              - {label: "Imagem de Capa (Story)", name: "story_image", widget: "image"}
              - label: "Lista de Produtos"
                name: "items"
                widget: "list"
                label_singular: "Mesa de Jantar"
                collapsed: true
                summary: "{{fields.nome}}"
                fields: *produto_fields

          # 8. MESAS DE CENTRO (NOVO)
          - label: "8. Mesas de Centro"
            name: "mesas_centro"
            widget: "object"
            collapsed: true
            hint: "Categoria exclusiva para Mesas de Centro"
            fields:
              - {label: "Imagem de Capa (Story)", name: "story_image", widget: "image"}
              - label: "Lista de Produtos"
                name: "items"
                widget: "list"
                label_singular: "Mesa de Centro"
                collapsed: true
                summary: "{{fields.nome}}"
                fields: *produto_fields
          
          # 9. POLTRONAS
          - label: "9. Poltronas"
            name: "poltronas"
            widget: "object"
            collapsed: true
            hint: "Clique para editar as Poltronas"
            fields:
              - {label: "Imagem de Capa (Story)", name: "story_image", widget: "image"}
              - label: "Lista de Produtos (Poltronas)"
                name: "items"
                widget: "list"
                label_singular: "Produto"
                collapsed: true
                hint: "Clique no botão (+) para adicionar uma nova Poltrona"
                summary: "{{fields.nome}}"
                fields: *produto_fields

          # 10. SOFÁS
          - label: "10. Sofás"
            name: "sofas"
            widget: "object"
            collapsed: true
            hint: "Clique para editar os Sofás"
            fields:
              - {label: "Imagem de Capa (Story)", name: "story_image", widget: "image"}
              - label: "Lista de Produtos (Sofás)"
                name: "items"
                widget: "list"
                label_singular: "Produto"
                collapsed: true
                hint: "Clique no botão (+) para adicionar um novo Sofá"
                summary: "{{fields.nome}}"
                fields: *produto_fields

          # 11. SOB MEDIDA
          - label: "11. Sob Medida (Slide)"
            name: "sob_medida"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Imagem de Capa", name: "imagem_capa", widget: "image"}
              - {label: "Título", name: "titulo", widget: "string", default: "SOB MEDIDA"}
              - {label: "Texto Descritivo", name: "texto", widget: "text"}
              - {label: "Texto do Botão", name: "botao_texto", widget: "string", default: "Personalizar Projeto"}
              - {label: "Link do Botão (WhatsApp)", name: "botao_link", widget: "string"}

          # 12. CONTATO
          - label: "12. Contato (Slide Final)"
            name: "contato"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Imagem de Fundo", name: "imagem_fundo", widget: "image"}
              - {label: "Título", name: "titulo", widget: "string", default: "CONTATO"}
              - label: "Links de Contato"
                name: "links"
                widget: "object"
                fields:
                  - {label: "WhatsApp URL", name: "whatsapp", widget: "string"}
                  - {label: "Email (mailto:)", name: "email", widget: "string"}
                  - {label: "Instagram URL", name: "instagram", widget: "string"}